apiVersion: v1
kind: LimitRange
metadata:
  name: flux-system-limits
  namespace: flux-system
spec:
  limits:
    - type: Container
      min:
        cpu: 10m
        memory: 50Mi
      max:
        cpu: "1"
        memory: 1Gi
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 50m
        memory: 128Mi
